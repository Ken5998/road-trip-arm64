name: Launcher release

# Publishes the launcher for ARM64 Linux as release vVERSION (the version in
# launcher/Cargo.toml). The launcher holds no game files, no BIOS and no
# emulator: on the device it fetches this repository's scripts and ARMSX2's own
# release, and sets the game up from the player's own disc and BIOS.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          command -v cargo || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build and pack the launcher
        run: scripts/package-launcher.sh out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=out/RoadTrip-Launcher-linux-arm64.tar.gz
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          scripts/release-notes.sh "v$version" > notes.md
          cat >> notes.md <<NOTES
          ## Install

          The Road Trip Adventure launcher $version for ARM64 Linux handhelds, such as the Retroid Pocket 6 on ArmadaOS.

          On the device, in Desktop Mode: unpack RoadTrip-Launcher-linux-arm64.tar.gz, start RoadTrip/roadtrip-launcher, choose your own Road Trip Adventure (PlayStation 2) disc image and the BIOS dumped from your own PlayStation 2, and press Install. It downloads ARMSX2, the PlayStation 2 emulator for ARM64, from its GitHub releases, sets it up for the game and adds the game to Steam with its artwork. Update gets the newest ARMSX2 later. It needs git, Python 3 and curl on the device, as ArmadaOS has.

          No game files, BIOS or emulator are included. SHA-256: \`$sha256\`
          NOTES
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release upload "v$version" "$archive" --clobber
            gh release edit "v$version" --notes-file notes.md
          else
            gh release create "v$version" "$archive" --title "Road Trip Adventure launcher $version for ARM64 Linux" \
              --notes-file notes.md --target "$GITHUB_SHA"
          fi
