name: Launcher release

# Publishes the launcher for ARM64 Linux as release vVERSION (the version in
# launcher/Cargo.toml). The launcher holds no game files, no BIOS and no
# emulator: on the device it fetches this repository's scripts and ARMSX2's own
# release, and sets the game up from the player's own disc and BIOS.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          command -v cargo || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build and pack the launcher
        run: scripts/package-launcher.sh out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=out/RoadTrip-Launcher-linux-arm64.tar.gz
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          scripts/release-notes.sh "v$version" > notes.md
          cat >> notes.md <<NOTES
          ## Setting up the emulator

          This is a launcher, not a port: it sets up ARMSX2, the PlayStation 2 emulator for ARM64, for Road Trip Adventure (Choro Q HG 2 works too) and adds the game to Steam.

          You need two things dumped from your own hardware: the game's disc image (.iso, .chd, .cso, ...) and the PlayStation 2 BIOS (a 4 MB .bin such as SCPH-39004.bin). Unpack RoadTrip-Launcher-linux-arm64.tar.gz in Desktop Mode, start RoadTrip/roadtrip-launcher, choose resolution and renderer, then **Install**. About 1 GB free is plenty.

          **Update** fetches a newer ARMSX2 when there is one; **ARMSX2 settings** opens the emulator's own window for anything else.

          Launcher SHA-256: \`$sha256\`. No game, BIOS or emulator in this release.
          NOTES
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release upload "v$version" "$archive" --clobber
            gh release edit "v$version" --notes-file notes.md
          else
            gh release create "v$version" "$archive" --title "Road Trip Adventure launcher $version for ARM64 Linux" \
              --notes-file notes.md --target "$GITHUB_SHA"
          fi
